spring.application.name=travelmate-backend
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travelmate?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:user30}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Jackson JSON
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Security
app.jwt.secret=${JWT_SECRET:travelmate-super-secure-jwt-secret-key-for-local-and-college-evaluation-2026}
app.jwt.expiration=86400000
